<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>生词本</title>
<style>
  :root {
    --bg: #faf8f5;
    --card: #ffffff;
    --ink: #1d1b18;
    --muted: #8a8378;
    --line: #eae4da;
    --accent: #1c6b58;
    --accent-soft: #e8f4ef;
    --today: #b45309;
    --today-soft: #fdf3e3;
    --shadow: 0 1px 2px rgba(29, 27, 24, 0.05);
    --radius: 16px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #121110;
      --card: #1c1b18;
      --ink: #f2eee7;
      --muted: #9b948a;
      --line: #2c2a25;
      --accent: #6cc6ab;
      --accent-soft: #16302a;
      --today: #e8a857;
      --today-soft: #2c2317;
      --shadow: none;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", "Microsoft YaHei", sans-serif;
    color: var(--ink);
    background: var(--bg);
    -webkit-font-smoothing: antialiased;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 28px 18px 96px; }

  header .top { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .badge { display: inline-flex; align-items: center; gap: 7px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
  .badge i { width: 7px; height: 7px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .count { font-size: 12.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  h1 { font-size: 30px; line-height: 1.2; margin: 12px 0 6px; letter-spacing: -0.02em; }
  .sub { margin: 0 0 20px; color: var(--muted); font-size: 14px; line-height: 1.6; }

  .search { position: relative; margin-bottom: 12px; }
  .search input {
    width: 100%; padding: 13px 42px 13px 15px; font-size: 15px; color: var(--ink);
    background: var(--card); border: 1px solid var(--line); border-radius: 13px;
    outline: none; transition: border-color .15s ease, box-shadow .15s ease;
    font-family: inherit;
  }
  .search input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .search input::-webkit-search-cancel-button { display: none; }
  .search .x {
    position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
    width: 28px; height: 28px; border: 0; border-radius: 50%; background: transparent;
    color: var(--muted); font-size: 18px; cursor: pointer; line-height: 1;
  }
  .bar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 26px; }
  .chips { display: flex; gap: 7px; flex: 1 1 auto; overflow-x: auto; scrollbar-width: none; }
  .chips::-webkit-scrollbar { display: none; }
  .chip {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; border: 1px solid var(--line);
    background: var(--card); color: var(--muted); font-size: 13px; font-weight: 500;
    cursor: pointer; font-family: inherit; transition: all .15s ease; white-space: nowrap;
  }
  .chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .ghost {
    flex: 0 0 auto; padding: 7px 13px; border-radius: 999px; border: 1px dashed var(--line);
    background: transparent; color: var(--muted); font-size: 13px; cursor: pointer; font-family: inherit;
  }
  .ghost[aria-pressed="true"] { border-style: solid; color: var(--accent); border-color: var(--accent); background: var(--accent-soft); }

  h2.sec {
    display: flex; align-items: center; gap: 8px;
    font-size: 14px; font-weight: 650; letter-spacing: .01em;
    margin: 0 0 12px; color: var(--ink);
  }
  h2.sec .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--today); }
  h2.sec em { font-style: normal; color: var(--muted); font-weight: 500; font-size: 12.5px; }
  #todayWrap { margin-bottom: 30px; }

  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(236px, 1fr)); gap: 11px; }

  .card {
    position: relative; padding: 14px 15px 12px; background: var(--card);
    border: 1px solid var(--line); border-radius: var(--radius);
    box-shadow: var(--shadow); cursor: pointer;
    transition: transform .14s ease, box-shadow .14s ease, border-color .14s ease;
  }
  @media (hover: hover) {
    .card:hover { transform: translateY(-1px); border-color: color-mix(in srgb, var(--accent) 35%, var(--line)); box-shadow: 0 8px 20px rgba(29,27,24,.08); }
  }
  .card:active { transform: scale(0.995); }
  .card.today { border-color: color-mix(in srgb, var(--today) 40%, var(--line)); background: linear-gradient(180deg, var(--today-soft), var(--card) 42%); }
  .card .w {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, "Times New Roman", serif;
    font-size: 23px; line-height: 1.25; letter-spacing: -0.01em; word-break: break-word;
  }
  .card .ph {
    display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
    margin-top: 5px; color: var(--muted); font-size: 12.5px;
  }
  .card .ph .ipa { font-family: "Iowan Old Style", Georgia, serif; }
  .spk {
    border: 0; border-radius: 5px; background: var(--accent-soft); color: var(--accent);
    padding: 1px 6px; cursor: pointer; font-size: 11px; font-family: inherit; line-height: 1.55;
    transition: background .15s ease, color .15s ease;
  }
  .spk:active, .spk.playing { background: var(--today-soft); color: var(--today); }
  .card .cn {
    margin-top: 9px; font-size: 13.5px; line-height: 1.5; color: var(--ink);
    transition: filter .18s ease, opacity .18s ease;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  body.conceal .card .cn { filter: blur(5.5px); opacity: .55; }
  body.conceal .card.reveal .cn { filter: none; opacity: 1; }
  .pos { color: var(--muted); font-style: italic; font-size: 12px; margin-right: 3px; }
  .meta {
    display: flex; align-items: center; gap: 8px; margin-top: 9px;
    font-size: 11.5px; color: var(--muted);
  }
  .tag { padding: 2px 7px; border-radius: 6px; background: color-mix(in srgb, var(--muted) 10%, transparent); }
  .tag.dict { color: var(--accent); background: var(--accent-soft); }
  .tag.sub { color: var(--today); background: var(--today-soft); }
  .meta time { margin-left: auto; font-variant-numeric: tabular-nums; }
  .card .pill {
    position: absolute; top: 10px; right: 10px; font-size: 10.5px; font-weight: 600;
    color: var(--today); background: var(--today-soft); border-radius: 999px; padding: 2px 7px;
  }

  #empty { color: var(--muted); font-size: 14px; padding: 28px 0; text-align: center; }

  footer { margin-top: 44px; color: color-mix(in srgb, var(--muted) 75%, transparent); font-size: 12px; line-height: 1.7; text-align: center; }
  footer a { color: inherit; text-underline-offset: 3px; }

  .fab { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 18px calc(12px + env(safe-area-inset-bottom)); display: flex; justify-content: center; pointer-events: none; background: linear-gradient(180deg, transparent, var(--bg) 45%); }
  .fab button {
    pointer-events: auto; width: 100%; max-width: 420px; padding: 13px 20px;
    border: 0; border-radius: 13px; background: var(--ink); color: var(--bg);
    font-size: 14.5px; font-weight: 600; font-family: inherit; cursor: pointer;
    box-shadow: 0 6px 20px rgba(29, 27, 24, .16);
  }
  .fab button:active { transform: scale(.99); }

  .modal { position: fixed; inset: 0; z-index: 30; display: grid; place-items: center; padding: 18px; background: rgba(18, 17, 16, .45); backdrop-filter: blur(3px); }
  .modal[hidden] { display: none; }
  .sheet {
    width: 100%; max-width: 420px; background: var(--card); border-radius: 20px;
    padding: 20px; border: 1px solid var(--line); max-height: 84vh; overflow-y: auto;
  }
  .sheet .shead { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
  .sheet .shead b { font-size: 15px; }
  .sheet .close { border: 0; background: transparent; color: var(--muted); font-size: 22px; line-height: 1; cursor: pointer; padding: 0 4px; }
  .q-cn { font-size: 21px; line-height: 1.5; margin: 6px 0 4px; word-break: break-word; }
  .q-pos { color: var(--muted); font-size: 12.5px; }
  .q-input {
    width: 100%; margin-top: 16px; padding: 12px 14px; font-size: 17px;
    border: 1px solid var(--line); border-radius: 11px; background: var(--bg); color: var(--ink);
    outline: none; font-family: "Iowan Old Style", Georgia, serif;
  }
  .q-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  .q-actions { display: flex; gap: 8px; margin-top: 12px; }
  .btn {
    flex: 1; padding: 11px 14px; border-radius: 11px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); font-size: 14px; font-weight: 550;
    font-family: inherit; cursor: pointer;
  }
  .btn.primary { background: var(--ink); border-color: var(--ink); color: var(--bg); }
  .answer { margin-top: 16px; padding: 14px; border-radius: 12px; background: var(--bg); border: 1px dashed var(--line); }
  .answer .aw { font-family: "Iowan Old Style", Georgia, serif; font-size: 22px; }
  .answer .verdict { font-size: 12.5px; margin-top: 6px; }
  .answer .verdict.ok { color: var(--accent); }
  .answer .verdict.no { color: var(--today); }
  .progressbar { height: 4px; border-radius: 999px; background: var(--line); overflow: hidden; margin-bottom: 18px; }
  .progressbar i { display: block; height: 100%; background: var(--accent); width: 0; transition: width .25s ease; }
  .summary { text-align: center; padding: 10px 0 4px; }
  .summary .big { font-size: 40px; font-family: "Iowan Old Style", Georgia, serif; }
  .summary p { color: var(--muted); font-size: 13.5px; margin: 6px 0 18px; }
  .wrong-list { text-align: left; margin: 0 0 16px; padding: 0; list-style: none; font-size: 13.5px; }
  .wrong-list li { display: flex; justify-content: space-between; gap: 10px; padding: 7px 0; border-bottom: 1px solid var(--line); }
  .wrong-list li:last-child { border-bottom: 0; }
  .wrong-list .m { color: var(--muted); text-align: right; }
  @media (max-width: 420px) { h1 { font-size: 26px; } .card .w { font-size: 21px; } }
</style>
</head>

  <div class="sheet" id="sheet"></div>
</div>

":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"rapidly","us":"ˈɹæpɪdli","uk":"ˈɹæpɪdli","pos":"adv.","cn":"快速地；迅速地","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"portal","us":"ˈpɔːɹtəl","uk":"ˈpɔːɹtəl","pos":"n.","cn":"入口；传送门；门户","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"plot","us":"plɑt","uk":"plɑt","pos":"n.","cn":"情节；阴谋","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"nostalgic","us":"nəˈstældʒɪk","uk":"nəˈstældʒɪk","pos":"adj.","cn":"怀旧的；念旧的","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"mature","us":"məˈt(j)ʊəɹ","uk":"məˈt(j)ʊəɹ","pos":"adj.","cn":"成熟的","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"intertwined","us":"ˌɪntərˈtwaɪnd","uk":"ˌɪntərˈtwaɪnd","pos":"adj.","cn":"交织的；缠绕的","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"emphasize","us":"ˈɛm.fə.saɪz","uk":"ˈɛm.fə.saɪz","pos":"v.","cn":"强调；着重","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"conquer","us":"ˈkɑŋkɚ","uk":"ˈkɑŋkɚ","pos":"v.","cn":"征服；战胜","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"cheesy","us":"ˈtʃiːzi","uk":"ˈtʃiːzi","pos":"adj.","cn":"俗套的；做作的；奶酪味的","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"characteristics","us":"ˌkæɹəktəˈɹɪstɪks","uk":"ˌkæɹəktəˈɹɪstɪks","pos":"n.","cn":"特征；特点（characteristic 的复数）","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"bend","us":"bɛnd","uk":"bɛnd","pos":"v.","cn":"操控；弯曲","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"agency","us":"","uk":"","pos":"n.","cn":"机构；代理处","src":["sub"],"first":"2026-08-07","last":"2026-08-07"},{"w":"squeeze","us":"skwiːz","uk":"skwiːz","pos":"v.","cn":"挤压；捏","src":["sub"],"first":"2026-08-06","last":"2026-08-06"}];
const TODAY = ["nuance", "catalyst", "vulnerability", "epoch", "nostalgic", "intertwined"];

const state = { q: "", filter: "all" };
const byWord = new Map(DATA.map(w => [w.w.toLowerCase(), w]));

// ---------- pronunciation ----------
let currentAudio = null;
let ttsVoice = null;
if (window.speechSynthesis) {
  const pick = () => {
    const voices = speechSynthesis.getVoices() || [];
    ttsVoice = voices.find(v => /^en[-_]US/i.test(v.lang)) || voices.find(v => /^en/i.test(v.lang)) || null;
  };
  pick();
  speechSynthesis.onvoiceschanged = pick;
}
function speakWithTTS(word, accent) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(word);
  u.lang = accent === "uk" ? "en-GB" : "en-US";
  if (ttsVoice && accent !== "uk") u.voice = ttsVoice;
  u.rate = 0.9;
  speechSynthesis.speak(u);
}
function speak(word, accent = "us", btn) {
  if (currentAudio) { try { currentAudio.pause(); } catch (e) {} }
  const url = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(word) + "&type=" + (accent === "uk" ? 1 : 2);
  const audio = new Audio(url);
  audio.preload = "auto";
  let fellBack = false;
  const fallback = () => { if (fellBack) return; fellBack = true; speakWithTTS(word, accent); };
  audio.onerror = fallback;
  const p = audio.play();
  if (p && p.catch) p.catch(fallback);
  currentAudio = audio;
  if (btn) {
    btn.classList.add("playing");
    setTimeout(() => btn.classList.remove("playing"), 900);
  }
}

// ---------- rendering ----------
function cardEl(item, isToday) {
  const el = document.createElement("article");
  el.className = "card" + (isToday ? " today" : "");
  el.dataset.word = item.w.toLowerCase();
  const ipa = item.us || item.uk || "";
  const srcTags = item.src.map(s => '<span class="tag ' + s + '">' + (s === "sub" ? "字幕" : "查词") + "</span>").join("");
  el.innerHTML =
    (isToday ? '<span class="pill">今日</span>' : "") +
    '<div class="w">' + esc(item.w) + "</div>" +
    '<div class="ph">' +
      (ipa ? '<span class="ipa">/' + esc(ipa) + "/</span>" : "") +
      '<button class="spk" data-accent="us">美</button>' +
      '<button class="spk" data-accent="uk">英</button>' +
    "</div>" +
    '<div class="cn">' + (item.pos ? '<span class="pos">' + esc(item.pos) + "</span>" : "") + esc(item.cn) + "</div>" +
    '<div class="meta">' + srcTags + "<time>" + esc(item.last.slice(5)) + "</time></div>";

  el.addEventListener("click", (ev) => {
    const spk = ev.target.closest(".spk");
    if (spk) {
      ev.stopPropagation();
      speak(item.w, spk.dataset.accent, spk);
      return;
    }
    if (ev.target.closest(".cn")) {
      if (document.body.classList.contains("conceal")) { el.classList.toggle("reveal"); return; }
      return;
    }
    speak(item.w, "us");
  });
  return el;
}
function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
}

const todayList = TODAY.map(w => byWord.get(w.toLowerCase())).filter(Boolean);
const todayKeys = new Set(todayList.map(w => w.w.toLowerCase()));

function matches(item) {
  if (state.filter === "dict" && !item.src.includes("dict")) return false;
  if (state.filter === "sub" && !item.src.includes("sub")) return false;
  if (!state.q) return true;
  const q = state.q.toLowerCase();
  return item.w.toLowerCase().includes(q) || item.cn.toLowerCase().includes(q);
}

function renderToday(visible) {
  const wrap = document.getElementById("todayWrap");
  wrap.hidden = !visible;
  if (!visible) return;
  document.getElementById("todayCount").textContent = todayList.length + " 个词";
  const grid = document.getElementById("todayGrid");
  grid.textContent = "";
  const frag = document.createDocumentFragment();
  todayList.forEach(item => frag.appendChild(cardEl(item, true)));
  grid.appendChild(frag);
}

function render() {
  // While searching / filtering, today's words join the main list instead of
  // being pinned above it, so a search never hides a match.
  const searching = Boolean(state.q) || state.filter !== "all";
  const showToday = todayList.length > 0 && !searching;
  renderToday(showToday);

  const list = DATA.filter(matches).filter(w => !(showToday && todayKeys.has(w.w.toLowerCase())));
  const grid = document.getElementById("grid");
  grid.textContent = "";
  const frag = document.createDocumentFragment();
  list.forEach(item => frag.appendChild(cardEl(item, false)));
  grid.appendChild(frag);
  document.getElementById("empty").hidden = list.length > 0;
  document.getElementById("shownCount").textContent = searching ? " · " + list.length + " 条" : "";
}

// ---------- interactions ----------
const qInput = document.getElementById("q");
qInput.addEventListener("input", () => {
  state.q = qInput.value.trim();
  document.getElementById("clear").hidden = !state.q;
  render();
});
document.getElementById("clear").addEventListener("click", () => {
  qInput.value = ""; state.q = ""; document.getElementById("clear").hidden = true; render(); qInput.focus();
});
document.getElementById("chips").addEventListener("click", (ev) => {
  const chip = ev.target.closest(".chip");
  if (!chip) return;
  document.querySelectorAll(".chip").forEach(c => c.setAttribute("aria-pressed", String(c === chip)));
  state.filter = chip.dataset.filter;
  render();
});
const concealBtn = document.getElementById("conceal");
concealBtn.addEventListener("click", () => {
  const on = document.body.classList.toggle("conceal");
  concealBtn.setAttribute("aria-pressed", String(on));
  concealBtn.textContent = on ? "显示释义" : "遮住释义";
  document.querySelectorAll(".card.reveal").forEach(c => c.classList.remove("reveal"));
});
document.addEventListener("keydown", (ev) => {
  if (ev.key === "/" && document.activeElement !== qInput) { ev.preventDefault(); qInput.focus(); }
});

// ---------- quiz ----------
const quiz = { list: [], i: 0, right: 0, wrong: [], answered: false };
const modal = document.getElementById("quiz");
const sheet = document.getElementById("sheet");

function startQuiz() {
  const pool = DATA.filter(matches);
  if (pool.length < 1) return;
  const shuffled = pool.slice().sort(() => Math.random() - 0.5).slice(0, Math.min(5, pool.length));
  quiz.list = shuffled; quiz.i = 0; quiz.right = 0; quiz.wrong = []; quiz.answered = false;
  modal.hidden = false;
  document.body.style.overflow = "hidden";
  drawQuiz();
}
function closeQuiz() {
  modal.hidden = true;
  document.body.style.overflow = "";
}
function drawQuiz() {
  const item = quiz.list[quiz.i];
  if (!item) return drawSummary();
  const pct = (quiz.i / quiz.list.length) * 100;
  sheet.innerHTML =
    '<div class="shead"><b>抽查默写 ' + (quiz.i + 1) + " / " + quiz.list.length + '</b><button class="close" aria-label="关闭">×</button></div>' +
    '<div class="progressbar"><i style="width:' + pct + '%"></i></div>' +
    '<div class="q-pos">' + (item.pos ? esc(item.pos) : "&nbsp;") + '</div>' +
    '<div class="q-cn">' + esc(item.cn) + "</div>" +
    '<input class="q-input" id="qi" placeholder="输入英文，回车看答案" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false">' +
    '<div class="q-actions"><button class="btn primary" id="reveal">看答案</button></div>';
  sheet.querySelector(".close").onclick = closeQuiz;
  const input = sheet.querySelector("#qi");
  input.focus({ preventScroll: true });
  const reveal = () => revealAnswer(item);
  sheet.querySelector("#reveal").onclick = reveal;
  input.addEventListener("keydown", (ev) => {
    if (ev.key === "Enter") { ev.preventDefault(); quiz.answered ? nextQuiz() : reveal(); }
  });
  modal.onclick = (ev) => { if (ev.target === modal) closeQuiz(); };
}
function revealAnswer(item) {
  if (quiz.answered) return;
  quiz.answered = true;
  const typed = (sheet.querySelector("#qi").value || "").trim().toLowerCase();
  const ok = typed === item.w.toLowerCase();
  if (ok) quiz.right++; else quiz.wrong.push(item);
  const ans = document.createElement("div");
  ans.className = "answer";
  ans.innerHTML =
    '<div class="aw">' + esc(item.w) + " <button class=\"spk\" data-accent=\"us\">美</button> <button class=\"spk\" data-accent=\"uk\">英</button></div>" +
    (item.us ? '<div class="q-pos">/' + esc(item.us) + "/</div>" : "") +
    '<div class="verdict ' + (ok ? "ok" : "no") + '">' + (ok ? "✓ 写对了" : (typed ? "✗ 你写的是 " + esc(typed) : "未作答")) + "</div>";
  ans.querySelectorAll(".spk").forEach(b => b.onclick = () => speak(item.w, b.dataset.accent, b));
  sheet.querySelector(".q-actions").innerHTML = '<button class="btn primary" id="next">下一个</button>';
  sheet.appendChild(ans);
  ans.scrollIntoView({ behavior: "smooth", block: "nearest" });
  sheet.querySelector("#next").onclick = nextQuiz;
  sheet.querySelector("#next").focus({ preventScroll: true });
}
function nextQuiz() {
  quiz.i++; quiz.answered = false;
  if (quiz.i >= quiz.list.length) return drawSummary();
  drawQuiz();
}
function drawSummary() {
  const total = quiz.list.length;
  const pct = total ? Math.round((quiz.right / total) * 100) : 0;
  sheet.innerHTML =
    '<div class="shead"><b>本轮结果</b><button class="close" aria-label="关闭">×</button></div>' +
    '<div class="summary"><div class="big">' + quiz.right + " / " + total + "</div>" +
    "<p>" + (pct === 100 ? "全对，稳！" : pct >= 60 ? "不错，错的再看一眼。" : "这批还得再过一遍。") + "</p></div>" +
    (quiz.wrong.length
      ? '<ul class="wrong-list">' + quiz.wrong.map(w => "<li><b>" + esc(w.w) + '</b><span class="m">' + esc(w.cn) + "</span></li>").join("") + "</ul>"
      : "") +
    '<div class="q-actions"><button class="btn" id="again">再来一轮</button><button class="btn primary" id="done">完成</button></div>';
  sheet.querySelector(".close").onclick = closeQuiz;
  sheet.querySelector("#done").onclick = closeQuiz;
  sheet.querySelector("#again").onclick = startQuiz;
  modal.onclick = (ev) => { if (ev.target === modal) closeQuiz(); };
}
document.getElementById("quizBtn").onclick = startQuiz;
document.addEventListener("keydown", (ev) => { if (ev.key === "Escape" && !modal.hidden) closeQuiz(); });

render();
</script>
